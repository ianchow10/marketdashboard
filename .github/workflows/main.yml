name: market-dashboard -- build & deploy

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Demo or live run'
        required: false
        default: 'demo'
        type: choice
        options:
          - demo
          - live

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market dashboard
        run: |
          if [ "${{ github.event.inputs.mode || 'demo' }}" = "demo" ]; then
            python market_dashboard.py --demo
          else
            python market_dashboard.py
          fi

      - name: Show docs directory
        run: |
          ls -la
          ls -la docs || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
